# Scheduled storage retention (manifest + archive to S3) — POST API on EC2.
# Configure repository secrets: API_BASE_URL, INTERNAL_CLEANUP_SECRET.
# The API host must have AWS_ARCHIVE_S3_BUCKET (and AWS creds / IAM) so storage_archive succeeds.
name: Archive purge storage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # daily 08:00 UTC

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: POST archive-purge (storage_manifest + storage_archive)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_CLEANUP_SECRET: ${{ secrets.INTERNAL_CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ] || [ -z "${INTERNAL_CLEANUP_SECRET:-}" ]; then
            echo "Missing secrets: set API_BASE_URL and INTERNAL_CLEANUP_SECRET on this repository."
            exit 1
          fi
          base="${API_BASE_URL%/}"
          url="${base}/api/internal/archive-purge/run"
          for attempt in 1 2 3; do
            echo "Attempt ${attempt} → ${url}"
            code=$(curl -sS -o /tmp/archive_purge_body.json -w "%{http_code}" \
              -X POST "$url" \
              -H "Authorization: Bearer ${INTERNAL_CLEANUP_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{"tasks":["storage_manifest","storage_archive"]}')
            echo "HTTP ${code}"
            cat /tmp/archive_purge_body.json || true
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1
