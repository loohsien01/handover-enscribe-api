# Scheduled orphan storage cleanup (GitHub-hosted timer → POST API on EC2).
# Configure repository secrets: API_BASE_URL (e.g. https://api.example.com), INTERNAL_CLEANUP_SECRET.
name: Cleanup unattached storage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # daily 08:00 UTC

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: POST internal cleanup
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_CLEANUP_SECRET: ${{ secrets.INTERNAL_CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ] || [ -z "${INTERNAL_CLEANUP_SECRET:-}" ]; then
            echo "Missing secrets: set API_BASE_URL and INTERNAL_CLEANUP_SECRET on this repository."
            exit 1
          fi
          base="${API_BASE_URL%/}"
          url="${base}/api/internal/cleanup/run"
          for attempt in 1 2 3; do
            echo "Attempt ${attempt} → ${url}"
            code=$(curl -sS -o /tmp/cleanup_body.json -w "%{http_code}" \
              -X POST "$url" \
              -H "Authorization: Bearer ${INTERNAL_CLEANUP_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{"tasks":["unattached_storage"]}')
            echo "HTTP ${code}"
            cat /tmp/cleanup_body.json || true
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1
