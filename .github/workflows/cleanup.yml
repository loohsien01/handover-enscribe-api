# Daily internal cleanup — POST /api/internal/cleanup/run on the API host.
# Secrets: API_BASE_URL, INTERNAL_CLEANUP_SECRET.
# Tasks: encounter_archive (needs Supabase archive migrations + AWS_ARCHIVE_S3_BUCKET on API),
#   unattached_storage (audio-files), unattached_note_template_sections.
# Per-run caps at 10 (raise later if throughput is too low).
name: Internal cleanup (encounter + unattached)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # daily 08:00 UTC

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: POST internal cleanup (encounter_archive, unattached_storage, unattached_note_template_sections)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_CLEANUP_SECRET: ${{ secrets.INTERNAL_CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ] || [ -z "${INTERNAL_CLEANUP_SECRET:-}" ]; then
            echo "Missing secrets: set API_BASE_URL and INTERNAL_CLEANUP_SECRET on this repository."
            exit 1
          fi
          base="${API_BASE_URL%/}"
          url="${base}/api/internal/cleanup/run"
          for attempt in 1 2 3; do
            echo "Attempt ${attempt} → ${url}"
            code=$(curl -sS -o /tmp/cleanup_body.json -w "%{http_code}" \
              -X POST "$url" \
              -H "Authorization: Bearer ${INTERNAL_CLEANUP_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{"tasks":["encounter_archive","unattached_storage","unattached_note_template_sections"],"maxEnqueue":10,"maxDeletesPerRunUnattachedStorage":10,"maxDeletesPerRunUnattachedNoteTemplateSections":10}')
            echo "HTTP ${code}"
            cat /tmp/cleanup_body.json || true
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1
