# Unattached note template sections — POST /api/internal/cleanup/run (Tu / Th / Su UTC).
# Secrets: API_BASE_URL, INTERNAL_CLEANUP_SECRET (same as other internal cleanup workflows).
name: Cleanup unattached note template sections

on:
  workflow_dispatch:
  schedule:
    # Sunday, Tuesday, Thursday 08:00 UTC
    - cron: '0 8 * * 0,2,4'

jobs:
  unattached-sections:
    runs-on: ubuntu-latest
    steps:
      - name: POST unattached_note_template_sections
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_CLEANUP_SECRET: ${{ secrets.INTERNAL_CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ] || [ -z "${INTERNAL_CLEANUP_SECRET:-}" ]; then
            echo "Missing secrets: set API_BASE_URL and INTERNAL_CLEANUP_SECRET on this repository."
            exit 1
          fi
          base="${API_BASE_URL%/}"
          url="${base}/api/internal/cleanup/run"
          for attempt in 1 2 3; do
            echo "Attempt ${attempt} → ${url}"
            code=$(curl -sS -o /tmp/unattached_note_template_sections_body.json -w "%{http_code}" \
              -X POST "$url" \
              -H "Authorization: Bearer ${INTERNAL_CLEANUP_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{"tasks":["unattached_note_template_sections"]}')
            echo "HTTP ${code}"
            cat /tmp/unattached_note_template_sections_body.json || true
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1
